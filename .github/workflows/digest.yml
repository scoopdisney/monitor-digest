name: monitor digest

on:
  schedule:
    # Hourly at :50 so a fresh digest is waiting before each feed run (:12 Pacific).
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node digest.mjs
      - name: Commit digest
        run: |
          git config user.name "monitor-digest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digest.md
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "digest $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
